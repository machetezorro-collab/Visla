<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#172631"><meta name="apple-mobile-web-app-capable" content="yes"><title>Виселица — дуэль</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b24;color:#f9eacb;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,select{font:inherit}button{touch-action:manipulation;cursor:pointer}#app{max-width:520px;min-height:100dvh;margin:auto;background:#1d2c37;box-shadow:0 0 50px #0008}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 17px 14px;background:#273e4a;border-bottom:3px solid #101d27}.logo{font-weight:1000;font-size:clamp(17px,5vw,22px);color:#f6c775}.scores{font-size:12px;text-align:right;line-height:1.7;color:#bfd0d0}.scene{position:relative;height:clamp(175px,28dvh,270px);overflow:hidden;background:linear-gradient(#436d84,#88a8a9 79%,#788c6b 80%)}.sun{position:absolute;top:22px;right:17%;width:48px;height:48px;background:#f3d39b;border-radius:50%;box-shadow:0 0 28px #f3d39baa}.cloud{position:absolute;top:27px;left:-75px;font-size:35px;animation:cloud 29s linear infinite;opacity:.8}.cloud.two{top:65px;animation-delay:-19s;animation-duration:36s;font-size:23px}.scene svg{width:100%;height:100%;position:absolute;inset:0}.gallows{stroke:#594637;stroke-width:11;fill:none;stroke-linecap:square}.figure{stroke:#20333c;stroke-width:5.5;fill:none;stroke-linecap:round}.crow{position:absolute;bottom:20px;right:14%;font-size:30px;animation:bob 1.8s ease-in-out infinite}.banner{background:#2b424e;color:#ffd37b;padding:11px;text-align:center;font-size:12px;font-weight:900;letter-spacing:.5px;min-height:39px}.main{padding:18px 16px calc(24px + env(safe-area-inset-bottom))}.title{text-align:center;font-size:22px;color:#ffd079;font-weight:1000;margin:3px 0 10px}.description{text-align:center;color:#c1d0cf;font-size:13px;line-height:1.6;margin:12px 0 18px}.label{display:block;color:#f3d08b;font-size:12px;font-weight:900;margin:17px 0 8px}input,select{width:100%;border:2px solid #69828b;background:#304752;color:#fff0d2;border-radius:8px;padding:13px;outline:none;font-size:16px;min-height:49px}input:focus,select:focus{border-color:#efc778}input::placeholder{color:#96aaad}.btn{width:100%;border:0;border-bottom:4px solid #996b39;border-radius:8px;padding:14px 9px;font-size:15px;font-weight:900;background:#f1c071;color:#272a2b}.btn.dark{background:#4a6670;border-color:#253e47;color:#f1e6cc}.btn:active,.letterkey:active{transform:translateY(2px)}.buttons{display:flex;gap:9px;margin-top:16px}.buttons button{flex:1;font-size:12px}.hide{display:none!important}.message{min-height:18px;color:#f6a18e;text-align:center;font-size:12px;margin-top:9px}.pass{padding:30px 0;text-align:center}.pass .big{font-size:55px}.hud{display:flex;justify-content:space-between;align-items:center;color:#b8cecd;font-size:12px}.clock{font-size:26px;font-weight:1000;color:#ffd47b}.bartrack{background:#3b535c;height:6px;margin:11px 0 12px;border-radius:10px;overflow:hidden}.bar{height:100%;width:100%;background:#f3c277}.hint{text-align:center;color:#bdcdd0;font-size:12px;line-height:1.6;min-height:38px;margin:13px 0}.word{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:20px 0}.tile{width:clamp(18px,7vw,31px);height:37px;text-align:center;border-bottom:3px solid #efc477;font-size:22px;font-weight:1000;line-height:34px}.tile.space{border:0;width:11px}.keys{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}.letterkey{height:clamp(37px,10vw,46px);border:0;border-bottom:3px solid #968d78;border-radius:5px;background:#eee0bf;color:#263944;font-size:clamp(13px,3.8vw,17px);font-weight:1000;padding:0}.letterkey.good{background:#84c3a1;border-color:#497d66}.letterkey.bad{background:#70545b;border-color:#48363f;color:#bca1a3}.letterkey:disabled{cursor:default}.result{color:#ffd17b;text-align:center;font-weight:900;font-size:15px;line-height:1.6;margin:14px 0}.footnote{text-align:center;color:#90a8ac;font-size:11px;margin-top:20px}@keyframes cloud{to{transform:translateX(650px)}}@keyframes bob{50%{transform:translateY(-7px) rotate(-10deg)}}
</style></head><body><div id="app"><header class="top"><div class="logo">☠ ВИСЕЛИЦА <small style="font-size:10px;color:#aec9c8">DUEL</small></div><div class="scores">ИГРОК 1 · <b id="s1">0</b> 🏆<br>ИГРОК 2 · <b id="s2">0</b> 🏆</div></header><div class="scene"><div class="sun"></div><div class="cloud">☁️ ☁️</div><div class="cloud two">☁️</div><svg viewBox="0 0 380 210" preserveAspectRatio="xMidYMid meet"><path d="M55 185H177M97 185V23H224V49" class="gallows"/><path d="M224 25V53" stroke="#ddbc8c" stroke-width="4"/><g class="figure"><circle data-part="1" cx="224" cy="73" r="20"/><path data-part="2" d="M224 93V136"/><path data-part="3" d="M224 105L200 125"/><path data-part="4" d="M224 105L248 125"/><path data-part="5" d="M224 136L203 169"/><path data-part="6" d="M224 136L246 169"/><path data-part="7" d="M216 68L222 74M222 68L216 74M228 68L234 74M234 68L228 74M218 84Q224 89 230 84"/></g><path d="M0 193H380" stroke="#596f58" stroke-width="5"/></svg><div class="crow">🐦‍⬛</div></div><div class="banner" id="banner">ДВА ИГРОКА · 7 ОШИБОК</div>
<section class="main" id="setup"><div class="title" id="setterTitle">ИГРОК 1 ЗАГАДЫВАЕТ</div><p class="description">Загадай слово и, если хочешь, добавь подсказку. Соперник не должен смотреть на экран.</p><label class="label" for="secret">🔒 СЕКРЕТНОЕ СЛОВО</label><input id="secret" type="password" placeholder="Например, капибара" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="32"><label class="label" for="clue">💡 ПОДСКАЗКА (НЕОБЯЗАТЕЛЬНО)</label><input id="clue" placeholder="Например, крупный грызун" autocomplete="off" maxlength="120"><label class="label" for="duration">⏱ ДЛИТЕЛЬНОСТЬ РАУНДА</label><select id="duration"><option value="0">∞ Без ограничения</option><option value="60">1 минута</option><option value="120">2 минуты</option><option value="180" selected>3 минуты</option><option value="300">5 минут</option><option value="600">10 минут</option><option value="900">15 минут</option></select><div class="message" id="validation"></div><button class="btn" id="prepare">🔐 ЗАГАДАТЬ СЛОВО</button><p class="footnote">Слово сохраняется только в открытой игре, никуда не отправляется.</p></section>
<section class="main hide" id="pass"><div class="pass"><div class="big">📱🔒</div><div class="title">ПЕРЕДАЙ ТЕЛЕФОН</div><p class="description" id="passText"></p><button class="btn" id="begin">▶ НАЧАТЬ УГАДЫВАТЬ</button></div></section>
<section class="main hide" id="play"><div class="hud"><span id="mistakeLabel">ОШИБКИ 0 / 7</span><span id="clock" class="clock">3:00</span></div><div class="bartrack"><div class="bar" id="bar"></div></div><p class="hint" id="hint"></p><div class="word" id="word"></div><div class="keys" id="keys"></div><div class="result hide" id="result"></div><div class="buttons"><button class="btn dark" id="reset">СБРОС СЧЁТА</button><button class="btn" id="next">НОВЫЙ РАУНД</button></div></section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id), alphabet=[...'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'];let word='',hint='',used=new Set(),errors=0,round=0,scores=[0,0],setter=0,guesser=1,total=180,remain=180,deadline=0,interval=null,active=false,done=false;function show(id){for(const p of ['setup','pass','play'])$(p).classList.toggle('hide',p!==id)}function draw(){document.querySelectorAll('[data-part]').forEach(x=>x.style.display=Number(x.dataset.part)<=errors?'':'none')}function format(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function clockRender(){$('clock').textContent=total?format(remain):'∞';$('bar').style.width=total?100*remain/total+'%':'100%';$('clock').style.color=total&&remain<=15?'#ff887c':'#ffd47b'}function wordRender(reveal=false){$('word').innerHTML='';for(const ch of word){const el=document.createElement('span');el.className='tile'+(ch===' '?' space':'');el.textContent=ch===' '?'':(used.has(ch)||reveal?ch:'');$('word').append(el)}}function finish(win,type=''){if(done)return;done=true;active=false;clearInterval(interval);scores[win?guesser:setter]++;$('s1').textContent=scores[0];$('s2').textContent=scores[1];$('banner').textContent=win?'🏆 СЛОВО УГАДАНО!':type==='time'?'⌛ ВРЕМЯ ВЫШЛО!':'💀 СЕМЬ ОШИБОК!';$('result').classList.remove('hide');$('result').textContent='ПОБЕДИЛ ИГРОК '+((win?guesser:setter)+1)+' · СЛОВО: '+word;document.querySelectorAll('.letterkey').forEach(x=>x.disabled=true);wordRender(true)}function guess(ch){if(!active||used.has(ch))return;used.add(ch);const correct=word.includes(ch);if(!correct)errors++;for(const b of document.querySelectorAll('.letterkey'))if(b.textContent===ch){b.disabled=true;b.classList.add(correct?'good':'bad')}draw();wordRender();$('mistakeLabel').textContent='ОШИБКИ '+errors+' / 7';if([...word].every(c=>c===' '||used.has(c)))finish(true);else if(errors>=7)finish(false);else $('banner').textContent=correct?'✓ ВЕРНО!':'✗ ОШИБКА · ОСТАЛОСЬ '+(7-errors)}function tick(){if(!active||!total)return;remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));clockRender();if(remain===0)finish(false,'time')}function newRound(){clearInterval(interval);active=false;done=false;$('setterTitle').textContent='ИГРОК '+(round%2+1)+' ЗАГАДЫВАЕТ';$('banner').textContent='НОВЫЙ РАУНД · 7 ОШИБОК';$('validation').textContent='';show('setup')}function begin(){show('play');active=true;done=false;$('mistakeLabel').textContent='ОШИБКИ 0 / 7';$('hint').textContent=hint?'💡 '+hint:'💡 Подсказки нет';$('result').classList.add('hide');$('banner').textContent='ИГРОК '+(guesser+1)+' УГАДЫВАЕТ';$('keys').innerHTML='';for(const ch of alphabet){const btn=document.createElement('button');btn.className='letterkey';btn.textContent=ch;btn.addEventListener('click',()=>guess(ch));$('keys').append(btn)}wordRender();clockRender();clearInterval(interval);if(total){deadline=Date.now()+total*1000;interval=setInterval(tick,200)}}$('secret').addEventListener('keydown',e=>{if(e.key==='Enter'){$('clue').focus()}});$('clue').addEventListener('keydown',e=>{if(e.key==='Enter'){$('prepare').click()}});$('prepare').addEventListener('click',()=>{let raw=$('secret').value.trim().toUpperCase().replace(/Ё/g,'Е').replace(/\s+/g,' ');if(!/^[А-Я]+(?:[ -][А-Я]+)*$/.test(raw)||raw.replace(/[ -]/g,'').length<2||raw.length>32){$('validation').textContent='⚠️ Только русские буквы, пробелы и дефис. Длина: 2–32 символа.';$('secret').focus();return}$('validation').textContent='';word=raw;hint=$('clue').value.trim();total=Number($('duration').value);remain=total;errors=0;used=new Set();setter=round%2;guesser=1-setter;round++;$('passText').textContent='Игрок '+(setter+1)+' загадал слово. Передай телефон игроку '+(guesser+1)+'. Слово скрыто.';$('secret').value='';$('clue').value='';$('banner').textContent='🔒 СЛОВО ЗАСЕКРЕЧЕНО';draw();show('pass')});$('begin').addEventListener('click',begin);$('next').addEventListener('click',newRound);$('reset').addEventListener('click',()=>{if(!confirm('Обнулить счёт и начать новую дуэль?'))return;round=0;scores=[0,0];$('s1').textContent=0;$('s2').textContent=0;newRound()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});draw();})();
</script></body></html>
